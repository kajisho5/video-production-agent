# ADR-117: follow the sibling Skills' releases. Twice a day (and by hand) scripts/repin.py takes each sibling's latest release tag,
# replaces the pin with the tag's committed contract/contract.json when the tag is newer, moves the pin's readers, classifies the change
# with `si contract-diff` (system-intelligence v0.7.0) and writes integration/siblings.lock.json. One pull request per run, always from
# the bot branch `bot/repin`, rebuilt from main each time (this workflow force-pushes that branch and no other); an open one is updated.
#   none / additive inside the gate: the pull request as is.  none / additive, a 0.x / 1.x minor outside the gate: the gate is widened.
#   breaking, or a major change: the pull request is labelled `repin: needs review` with a comment, and the `repin review` check stays
#   red until a person removes the label. Nothing is merged here.
# A pull request opened with the workflow token starts no workflow by itself, so this workflow starts `tests` and `repin review` on the
# branch (workflow_dispatch). With a REPIN_TOKEN secret (a token that may push and open pull requests), the push starts them as usual.
name: repin
on:
  schedule:
    - cron: "11 2,14 * * *"   # 02:11 and 14:11 UTC (11:11 / 23:11 JST); off the hour, where scheduled runs queue up
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
concurrency:
  group: repin
  cancel-in-progress: false
jobs:
  repin:
    runs-on: ubuntu-latest
    env:
      BRANCH: bot/repin
      GH_TOKEN: ${{ secrets.REPIN_TOKEN || github.token }}
      HAS_PAT: ${{ secrets.REPIN_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.REPIN_TOKEN || github.token }}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      # system-intelligence v0.7.0 (32e087f), for `si contract-diff`
      - run: pip install "system-intelligence @ git+https://github.com/kajisho5/system-intelligence@32e087fb3aa499d054e71338e27bcf967eed91cc"
      - id: update
        run: |
          python scripts/repin.py update --si si --report "$RUNNER_TEMP/report.json" --pr-body "$RUNNER_TEMP/body.md"
          python scripts/repin.py check
          cat "$RUNNER_TEMP/body.md" >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$(git status --porcelain)" ]; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi
          echo "review=$(jq -r .review "$RUNNER_TEMP/report.json")" >> "$GITHUB_OUTPUT"
      - name: no change, close a stale pull request
        if: steps.update.outputs.changed == 'false'
        run: |
          number="$(gh api "repos/${GITHUB_REPOSITORY}/pulls?head=${GITHUB_REPOSITORY_OWNER}:${BRANCH}&state=open" --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${number}/comments" \
              -f body=$'main already has every latest release pinned; closing.\n\n---\n_Generated by the repin workflow (ADR-117)_' --jq .html_url
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/pulls/${number}" -f state=closed --jq .state
          fi
      - name: push the bot branch and open or update the pull request
        if: steps.update.outputs.changed == 'true'
        env:
          REVIEW: ${{ steps.update.outputs.review }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          updated="$(jq -r '[.updates[] | "\(.sibling) \(.new)"] | join(", ")' "$RUNNER_TEMP/report.json")"
          title="Re-pin sibling contracts from their release tags: ${updated}"
          [ "${#title}" -le 200 ] || title="Re-pin $(jq '.updates | length' "$RUNNER_TEMP/report.json") sibling contracts from their release tags"
          git switch -C "$BRANCH"
          git add -A
          git commit -q -m "$title" -m "Automatic re-pin (scripts/repin.py update, ADR-117). Each pin is the tag's committed contract/contract.json, byte for byte."
          git push --force origin "HEAD:refs/heads/${BRANCH}"     # the bot branch only: rebuilt from main on every run
          body="$(cat "$RUNNER_TEMP/body.md")"
          number="$(gh api "repos/${GITHUB_REPOSITORY}/pulls?head=${GITHUB_REPOSITORY_OWNER}:${BRANCH}&state=open" --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/pulls/${number}" -f title="$title" -f body="$body" --jq .html_url
          else
            number="$(gh api -X POST "repos/${GITHUB_REPOSITORY}/pulls" -f title="$title" -f head="$BRANCH" -f base=main -f body="$body" --jq .number)"
          fi
          for label in "repin" "repin: needs review"; do
            gh api "repos/${GITHUB_REPOSITORY}/labels/$(jq -rn --arg l "$label" '$l|@uri')" --silent 2>/dev/null \
              || gh api -X POST "repos/${GITHUB_REPOSITORY}/labels" -f name="$label" -f color="$([ "$label" = repin ] && echo 0e8a16 || echo d93f0b)" --silent
          done
          gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${number}/labels" -f "labels[]=repin" --silent
          if [ "$REVIEW" = true ]; then
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${number}/labels" -f "labels[]=repin: needs review" --silent
            reasons="$(jq -r '.updates[] | select(.decision == "review") | "- \(.sibling) \(.old) -> \(.new): \(.reasons | join("; "))"' "$RUNNER_TEMP/report.json")"
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${number}/comments" -f body="A person must review this re-pin before it is merged:

          ${reasons}

          The gate was not widened for these. Remove the label \`repin: needs review\` once the change is understood (and the adapter, tests or gate are updated where needed); the \`repin review\` check turns green then.

          ---
          _Generated by the repin workflow (ADR-117)_" --jq .html_url
          else
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/issues/${number}/labels/$(jq -rn '"repin: needs review"|@uri')" --silent 2>/dev/null || true
          fi
          if [ "$HAS_PAT" != true ]; then
            gh workflow run tests.yml --ref "$BRANCH"
            gh workflow run repin-review.yml --ref "$BRANCH"
          fi
          echo "pull request #${number}" >> "$GITHUB_STEP_SUMMARY"
