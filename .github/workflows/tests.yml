# Manual trigger only for now (the account's Actions minutes are limited; ffmpeg-skill's CI uses the same policy).
# Add `pull_request:` under `on:` when minutes are available.
name: tests
on:
  workflow_dispatch:
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python }}"}
      - run: pip install -e .
      - run: python -m unittest -v tests/test_unit.py
      - run: python evals/run.py
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: git clone --depth 1 https://github.com/kajisho5/ffmpeg-skill ../ffmpeg-skill
      - run: git clone --depth 1 https://github.com/kajisho5/media-analysis-skill ../media-analysis-skill
      - run: git clone --depth 1 https://github.com/kajisho5/transcription-skill ../transcription-skill   # contract / doctor / path policy only: no ASR engine, no model download in CI
      # video-editing-skill (ADR-028): its PR #1 branch until it is merged to main (main holds only a README today); no install needed, the checkout is run as `python -m video_editing_skill.cli`
      - run: git clone --depth 1 --branch claude/video-editing-skill-sd9vgt https://github.com/kajisho5/video-editing-skill ../video-editing-skill
      # audio-production-skill (ADR-030): main (PR #1 merged); run as `python -m audio_production.cli` from the checkout, no install
      - run: git clone --depth 1 https://github.com/kajisho5/audio-production-skill ../audio-production-skill
      - run: pip install -e .
      - run: python -m unittest -v tests/test_integration.py
        env:
          VIDEO_AGENT_FFMPEG_SKILL_DIR: "${{ github.workspace }}/../ffmpeg-skill"
          VIDEO_AGENT_MEDIA_ANALYSIS_DIR: "${{ github.workspace }}/../media-analysis-skill"
          VIDEO_AGENT_TRANSCRIPTION_DIR: "${{ github.workspace }}/../transcription-skill"
          VIDEO_AGENT_VIDEO_EDITING_DIR: "${{ github.workspace }}/../video-editing-skill"
          VIDEO_AGENT_AUDIO_PRODUCTION_DIR: "${{ github.workspace }}/../audio-production-skill"
