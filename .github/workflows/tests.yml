# Runs by itself on every pull request, on every push to main and once a night; `workflow_dispatch` stays for a run by hand.
# The repository is public, so the standard GitHub-hosted runners cost no Actions minutes.
# ADR-117: the integration job runs the sibling Skills at the releases in integration/siblings.lock.json (the releases the pins were
# taken from; scripts/repin.py and the `repin` workflow move pins and lock together), so this run changes only with this repository or
# ffmpeg-skill main. The early warning for a sibling's main is the `canary` workflow. A failed nightly run here (ffmpeg-skill main, or
# Velisa main's ecosystem.json) opens the "Nightly tests failed" issue (or comments on the open one): see the `nightly-failure` job.
name: tests
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 18 * * *"   # 18:17 UTC every day (03:17 JST); off the hour, where scheduled runs queue up
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # A new push to a pull request cancels that pull request's run in progress. Every other run (main, nightly, by hand) has a
  # group of its own (the run id), so it is never cancelled and never replaced while it waits.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || format('{0}-{1}', github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]   # not ubuntu-latest: Ubuntu 26.04 runners have no Python 3.9
        python: ["3.9", "3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python }}"}
      - run: pip install -e .
      - run: python -m unittest -v tests/test_unit.py
      # Phase 3 (ADR-031 / ADR-032): the five finishing-Skill adapters against their fake processes, and the integrated pipeline on the fake engine + fake Skills
      - run: python -m unittest -v tests/test_adapter_subtitle.py tests/test_adapter_thumbnail.py tests/test_adapter_color_grading.py tests/test_adapter_motion_graphics.py tests/test_adapter_qc.py
      - run: python -m unittest -v tests/test_pipeline.py
      # the provides / Capability-id diagnostic (skills/diagnostics.py, `video-agent skills --check-provides`): synthetic cases and the pinned contracts, no Skill checkout
      - run: python -m unittest -v tests/test_skills_diagnostics.py
      # ADR-117: scripts/repin.py (tags, gate, decision, moving a pin's readers) and the integration lock against the pins; no network
      - run: python -m unittest -v tests/test_repin.py
      # ADR-048 / ADR-049: loudness result shapes and the Anthropic provider (fake client; the SDK-error mapping test skips without the `ai` extra); ADR-061: brief → requirements; ADR-062: colour / trim / rotate parameters; ADR-063: audio mix / noise reduction / dynamics, subtitle mux; ADR-066: card offload through a fake `ingest`; ADR-073: voice-enhance through a fake `voice-enhance`; ADR-077: overlay image preparation through a fake imagemagick-skill checkout; ADR-085: dubbing through a fake `dubbing`; ADR-086: speaker turns through a fake `diarization`; ADR-087: publishing through a fake `publish`; ADR-088: the full ThumbnailDocument (logo, several texts); ADR-089: the NLE hand-off through a fake `nle-bridge`; ADR-090: face tracks through a fake `detection`, blurred by the fake engine; ADR-091: slide timeline through a fake `slide-sync`; ADR-092: the music bed through a fake `sound-design`; ADR-093: measured motion through a fake remotion-ffmpeg-skill checkout; ADR-095: document verification through a fake `artifacts-skill`; ADR-096: speaker ids through fake diarization / transcription / subtitle; ADR-099: video-editing 0.5.0 (punch in, proposals / condense, precision auto, segment cache, stinger, AI-generated inputs) through the fake `video-editing`; ADR-100: color-grading 0.5.0 (OCIO transform, camera match, legalize) through the fake `color-grading`; ADR-101: subtitle 0.8.0 (TTML / EBU-TT-D, placement, regional / caption profiles, ruby, words, vertical) through the fake `subtitle`; ADR-102: motion-graphics 0.2.16 (logo, rendered layer, style / fit, brand kit, themes, reserved regions) through the fake `motion-graphics`; ADR-103: the edit_style analysis kind through the fake `media-analysis`; ADR-104: thumbnail 0.1.15 (choose_frame / place_text / variants / layers / batch) through the fake `thumbnail` and `detection`; ADR-107: subtitle 0.9.0 `fonts_dir` (burn only) and its guided refusal through the fake `subtitle`; ADR-108: live contract vs pin, the release version by the gate's range and the rest by the adapter's drift function, on every adapter's real pin; ADR-109: word-index plans (numbering, word ranges → seconds, refusals) through the fake `transcription` and a fake provider; ADR-110: the post-render transcript check (normalisation, alignment, report, skip paths) through the fake `transcription`; ADR-111: feedback scopes, the versioned preference store, corrections per minute; ADR-112: the opt-in qc-skill stinger cut-point and loop-seam checks (keys, IR, QA items, the stinger file) through the fake `qc`, `video-editing` and `sound-design`; ADR-113: opt-in transcription engine / model / word segmentation in plans (explicit --set only, the contract's declarations, the Skill's own dry run before any analysis) through the fake `transcription`; ADR-115: the concat timeline on video-editing's whole-frame grid (take picks on frames too), and the real-media tests' temporary directories removed on failure / interrupt; ADR-116: the loudness comparison's meter parsers (tools/loudness_compare.py); ADR-120: the timebase conformance vectors (velisa/timebase@1) and the concat rate read by them
      - run: python -m unittest -v tests/test_loudness_measured.py tests/test_ai_claude.py tests/test_ai_host.py tests/test_version_gates.py tests/test_timeline.py tests/test_takes.py tests/test_crop.py tests/test_brief.py tests/test_satellite_params.py tests/test_offload.py tests/test_voice_enhance.py tests/test_image_prepare.py tests/test_face_redaction.py tests/test_handoff_contracts.py tests/test_dubbing.py tests/test_diarization.py tests/test_publish.py tests/test_thumbnail_document.py tests/test_nle.py tests/test_slides.py tests/test_bgm.py tests/test_remotion.py tests/test_documents.py tests/test_speaker_ids.py tests/test_video_editing_features.py tests/test_color_grading_features.py tests/test_subtitle_features.py tests/test_motion_graphics_features.py tests/test_edit_style.py tests/test_thumbnail_features.py tests/test_release_version.py tests/test_word_cut.py tests/test_transcript_verify.py tests/test_preferences.py tests/test_qc_checks.py tests/test_transcribe_options.py tests/test_html_layer.py tests/test_measurements.py tests/test_concat_whole_frames.py tests/test_timebase.py tests/test_tmp_dirs.py tests/test_loudness_compare.py
      - run: python evals/run.py
  integration:
    # ADR-117: the real-Skill suite (.github/workflows/integration.yml), with every sibling Skill at the release its pin was taken from
    # (integration/siblings.lock.json: tag, commit, and the tag's contract/contract.json equal to the pin). A sibling's main moving cannot
    # turn this run red; the nightly `canary` workflow runs the same suite against the siblings' mains and reports, without failing.
    # ffmpeg-skill keeps its two legs (main and v2.24.1) as before.
    uses: ./.github/workflows/integration.yml
    with:
      siblings: lock
  nightly-failure:
    # Only for the nightly run: make its failure visible as an issue. One open issue at a time; later failures comment on it.
    name: report nightly failure
    needs: [unit, integration]   # `integration` is every engine leg x shard
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Nightly tests failed
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="The nightly \`tests\` run failed on \`${GITHUB_SHA}\`: ${RUN_URL}

          The integration job runs the sibling Skills at the releases in integration/siblings.lock.json (ADR-117), so the usual cause is ffmpeg-skill main (its main leg), Velisa main's ecosystem.json, or a change on this repository's main. Sibling Skills' mains are the canary workflow's. Close this issue once a nightly run is green again."
          number="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=100" \
            | jq -s --arg t "$TITLE" '[.[][] | select(.pull_request == null and .title == $t) | .number] | first // empty')"
          if [ -n "$number" ]; then
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${number}/comments" -f body="$body" --jq .html_url
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues" -f title="$TITLE" -f body="$body" --jq .html_url
          fi
