# Manual trigger only for now (the account's Actions minutes are limited; ffmpeg-skill's CI uses the same policy).
# Add `pull_request:` under `on:` when minutes are available.
name: tests
on:
  workflow_dispatch:
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]   # not ubuntu-latest: Ubuntu 26.04 runners have no Python 3.9
        python: ["3.9", "3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python }}"}
      - run: pip install -e .
      - run: python -m unittest -v tests/test_unit.py
      # Phase 3 (ADR-031 / ADR-032): the five finishing-Skill adapters against their fake processes, and the integrated pipeline on the fake engine + fake Skills
      - run: python -m unittest -v tests/test_adapter_subtitle.py tests/test_adapter_thumbnail.py tests/test_adapter_color_grading.py tests/test_adapter_motion_graphics.py tests/test_adapter_qc.py
      - run: python -m unittest -v tests/test_pipeline.py
      # ADR-048 / ADR-049: loudness result shapes and the Anthropic provider (fake client; the SDK-error mapping test skips without the `ai` extra); ADR-061: brief → requirements; ADR-062: colour / trim / rotate parameters; ADR-063: audio mix / noise reduction / dynamics, subtitle mux; ADR-066: card offload through a fake `ingest`; ADR-073: voice-enhance through a fake `voice-enhance`; ADR-077: overlay image preparation through a fake imagemagick-skill checkout; ADR-086: speaker turns through a fake `diarization`
      - run: python -m unittest -v tests/test_loudness_measured.py tests/test_ai_claude.py tests/test_ai_host.py tests/test_version_gates.py tests/test_timeline.py tests/test_takes.py tests/test_crop.py tests/test_brief.py tests/test_satellite_params.py tests/test_offload.py tests/test_voice_enhance.py tests/test_image_prepare.py tests/test_diarization.py
      - run: python evals/run.py
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core imagemagick   # imagemagick: ADR-077's ImagePrepareRealTests (imagemagick-skill uses IM6's convert / identify)
      - run: git clone --depth 1 https://github.com/kajisho5/ffmpeg-skill ../ffmpeg-skill
      - run: git clone --depth 1 https://github.com/kajisho5/media-analysis-skill ../media-analysis-skill
      - run: git clone --depth 1 https://github.com/kajisho5/transcription-skill ../transcription-skill   # contract / doctor / path policy only: no ASR engine, no model download in CI
      # video-editing-skill (ADR-028): main (PR #1 merged); no install needed, the checkout is run as `python -m video_editing_skill.cli`
      - run: git clone --depth 1 https://github.com/kajisho5/video-editing-skill ../video-editing-skill
      # audio-production-skill (ADR-030): main (PR #1 merged); run as `python -m audio_production.cli` from the checkout, no install
      - run: git clone --depth 1 https://github.com/kajisho5/audio-production-skill ../audio-production-skill
      # Phase 3 finishing Skills (ADR-031 / ADR-032): main (PR #1 merged in each); run from the checkouts, no install. thumbnail-skill renders with Pillow.
      - run: git clone --depth 1 https://github.com/kajisho5/subtitle-skill ../subtitle-skill
      - run: git clone --depth 1 https://github.com/kajisho5/thumbnail-skill ../thumbnail-skill
      - run: git clone --depth 1 https://github.com/kajisho5/color-grading-skill ../color-grading-skill
      - run: git clone --depth 1 https://github.com/kajisho5/motion-graphics-skill ../motion-graphics-skill
      - run: git clone --depth 1 https://github.com/kajisho5/qc-skill ../qc-skill
      # ingest-skill (ADR-059): URL inputs go through `ingest fetch`; its fetch extra installs yt-dlp. The test downloads from 127.0.0.1 only. ADR-066: the card offload (IngestOffloadRealTests) runs on a synthetic XDCAM EX-like card
      - run: git clone --depth 1 https://github.com/kajisho5/ingest-skill ../ingest-skill
      # voice-enhance-skill (ADR-073): main (no release tag); run from the checkout. No engine in CI: the tests stand in a deep-filter that copies its input
      # and a nara_wpe whose wpe_v8 is the identity (as voice-enhance-skill's own tests do); numpy is for those engines' STFT and the real crosstalk engine
      - run: git clone --depth 1 https://github.com/kajisho5/voice-enhance-skill ../voice-enhance-skill
      # imagemagick-skill (ADR-077): main (contract 0.8.1, = the v0.8.1 tag but for CI files); its scripts run from the checkout, standard library only
      - run: git clone --depth 1 https://github.com/kajisho5/imagemagick-skill ../imagemagick-skill
      # diarization-skill (ADR-086): main (no release tag); run from the checkout. No pyannote.audio and no gated pipeline in CI: the tests check the
      # live contract, the doctor's not-ready verdict and the handoff
      - run: git clone --depth 1 https://github.com/kajisho5/diarization-skill ../diarization-skill
      - run: pip install -e . Pillow opentimelineio numpy -e "../ingest-skill[fetch]"   # opentimelineio: read the exported timeline back (ADR-052); not a runtime dependency
      - run: python -m unittest -v tests/test_integration.py
        env:
          VIDEO_AGENT_FFMPEG_SKILL_DIR: "${{ github.workspace }}/../ffmpeg-skill"
          VIDEO_AGENT_MEDIA_ANALYSIS_DIR: "${{ github.workspace }}/../media-analysis-skill"
          VIDEO_AGENT_TRANSCRIPTION_DIR: "${{ github.workspace }}/../transcription-skill"
          VIDEO_AGENT_VIDEO_EDITING_DIR: "${{ github.workspace }}/../video-editing-skill"
          VIDEO_AGENT_AUDIO_PRODUCTION_DIR: "${{ github.workspace }}/../audio-production-skill"
          VIDEO_AGENT_SUBTITLE_DIR: "${{ github.workspace }}/../subtitle-skill"
          VIDEO_AGENT_THUMBNAIL_DIR: "${{ github.workspace }}/../thumbnail-skill"
          VIDEO_AGENT_COLOR_GRADING_DIR: "${{ github.workspace }}/../color-grading-skill"
          VIDEO_AGENT_MOTION_GRAPHICS_DIR: "${{ github.workspace }}/../motion-graphics-skill"
          VIDEO_AGENT_QC_DIR: "${{ github.workspace }}/../qc-skill"
          VIDEO_AGENT_INGEST_DIR: "${{ github.workspace }}/../ingest-skill"
          VIDEO_AGENT_VOICE_ENHANCE_DIR: "${{ github.workspace }}/../voice-enhance-skill"
          VIDEO_AGENT_IMAGEMAGICK_DIR: "${{ github.workspace }}/../imagemagick-skill"
          VIDEO_AGENT_DIARIZATION_DIR: "${{ github.workspace }}/../diarization-skill"
      # ADR-076: the color-grading adapter against color-grading-skill main (live contract = the colour vocabulary the agent's keys are read from; RETAG / PRIMARY_CORRECTION on real media); the fake-based tests of the same file run in the unit job
      - run: python -m unittest -v tests.test_adapter_color_grading.ColorGradingRealSkillTests
        env:
          VIDEO_AGENT_COLOR_GRADING_DIR: "${{ github.workspace }}/../color-grading-skill"
          VIDEO_AGENT_FFMPEG_SKILL_DIR: "${{ github.workspace }}/../ffmpeg-skill"
      # ADR-058: the qc adapter against qc-skill main (contract drift, reference metrics SSIM / PSNR); the fake-based tests of the same file run in the unit job
      - run: python -m unittest -v tests.test_adapter_qc.QcRealSkillTests
        env:
          VIDEO_AGENT_QC_DIR: "${{ github.workspace }}/../qc-skill"
